name: Daily Odoo Report Automation

on:
  schedule:
    # Runs every 30 minutes between 9:00 AM and 1:00 PM Asia/Dhaka (03:00–07:00 UTC)
    - cron: "0,30 3-6 * * *"

  workflow_dispatch:
    inputs:
      run_mt:
        description: 'Run Mt_db.py'
        type: boolean
        default: false
      run_zip:
        description: 'Run Zip_db.py'
        type: boolean
        default: false
      run_zip_dash:
        description: 'Run Zip_dash.py'
        type: boolean
        default: false
      run_mt_dash:
        description: 'Run Mt_dash.py'
        type: boolean
        default: false
      run_all:
        description: 'Run ALL scripts (overrides individual toggles)'
        type: boolean
        default: true

concurrency:
  group: daily-odoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-odoo-reports:
    runs-on: ubuntu-22.04

    env:
      # Inject Odoo credentials from GitHub Secrets
      ODOO_URL: ${{ secrets.ODOO_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libxi6 wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-linux-signing-key.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-key.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas numpy \
            gspread gspread-dataframe google-auth google-auth-httplib2 google-api-python-client \
            selenium chromedriver-autoinstaller \
            openpyxl python-dotenv

      - name: Create Google credentials file
        run: |
          printf '%s' '${{ secrets.GOOGLE_SHEET_CRED_JSON }}' > "$GITHUB_WORKSPACE/credentials.json"

      # ---------- RUNNERS (conditional) ----------
      - name: Run MT_db script
        if: ${{ github.event_name != 'workflow_dispatch' && true || inputs.run_all == true || inputs.run_mt == true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python Mt_db.py

      - name: Run Zipper_db script
        if: ${{ github.event_name != 'workflow_dispatch' && true || inputs.run_all == true || inputs.run_zip == true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python Zip_db.py

      - name: Run Zip_dash script
        if: ${{ github.event_name != 'workflow_dispatch' && true || inputs.run_all == true || inputs.run_zip_dash == true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python Zip_dash.py

      - name: Run Mt_dash script
        if: ${{ github.event_name != 'workflow_dispatch' && true || inputs.run_all == true || inputs.run_mt_dash == true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python Mt_dash.py
